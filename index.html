<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- PeerJS (サーバー不要で端末同士を直接つなぐライブラリ) -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-2 sm:p-4 selection:bg-emerald-500 selection:text-slate-950">

    <div id="app" class="w-full max-w-5xl h-[92vh] max-h-[850px] bg-slate-900/90 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col backdrop-blur-md relative">
        <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center z-10 shrink-0">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-950 font-bold shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid font-black fa-comments"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg tracking-tight bg-gradient-to-r from-slate-100 to-slate-400 bg-clip-text text-transparent">Private Chat</h1>
                    <p id="header-status" class="text-xs text-slate-400">オンライン対応チャット</p>
                </div>
            </div>
            
            <div id="room-info-bar" class="hidden items-center gap-2 sm:gap-3">
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-lg px-3 py-1.5 flex items-center space-x-2">
                    <span class="text-xs text-slate-400 font-medium">ROOM:</span>
                    <span id="display-room-id" class="text-xs font-mono text-emerald-400 font-semibold tracking-wider">------</span>
                    <button id="copy-room-id-btn" class="text-slate-400 hover:text-emerald-400 transition-colors p-1" title="ルームIDをコピー">
                        <i class="fa-regular fa-copy text-xs"></i>
                    </button>
                </div>
                <button id="leave-room-btn" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded-lg text-xs font-medium transition-all duration-200 flex items-center gap-1.5">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="hidden sm:inline">退出</span>
                </button>
            </div>
        </header>

        <main class="flex-1 flex overflow-hidden relative">
            <div id="lobby-screen" class="w-full h-full flex items-center justify-center p-4 overflow-y-auto scrollbar-thin">
                <div class="w-full max-w-md bg-slate-900/80 border border-slate-800 p-6 sm:p-8 rounded-2xl shadow-xl space-y-6 my-auto">
                    <div class="text-center space-y-2">
                        <h2 class="text-xl font-bold text-slate-100">チャットをはじめる</h2>
                        <p class="text-xs text-slate-400">表示名を入力して新規作成または参加してください</p>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                            <i class="fa-solid fa-user text-emerald-400"></i> あなたの表示名
                        </label>
                        <input type="text" id="username-input" placeholder="例: 佐藤" max="20"
                            class="w-full bg-slate-950 border border-slate-700/80 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition-all">
                    </div>

                    <div class="border-t border-slate-800 pt-5 space-y-4">
                        <div class="flex p-1 bg-slate-950 rounded-xl border border-slate-800">
                            <button id="tab-join-btn" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-100 bg-slate-800 shadow">既存のルームに参加</button>
                            <button id="tab-create-btn" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-slate-200">新規ルーム作成</button>
                        </div>

                        <div id="form-join" class="space-y-4">
                            <div class="space-y-1.5">
                                <label class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                                    <i class="fa-solid fa-key text-emerald-400"></i> ルームID
                                </label>
                                <input type="text" id="join-room-id" placeholder="6桁のルームIDを入力" 
                                    class="w-full bg-slate-950 border border-slate-700/80 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 uppercase outline-none font-mono tracking-wider transition-all">
                            </div>
                            <button id="action-join-btn" type="button" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl py-3 text-sm shadow-lg shadow-emerald-500/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-right-to-bracket"></i> ルームに参加する
                            </button>
                        </div>

                        <div id="form-create" class="space-y-4 hidden">
                            <div class="space-y-1.5">
                                <label class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                                    <i class="fa-solid fa-heading text-emerald-400"></i> ルーム名
                                </label>
                                <input type="text" id="create-room-name" placeholder="例: フリートーク部屋" max="30"
                                    class="w-full bg-slate-950 border border-slate-700/80 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition-all">
                            </div>
                            <button id="action-create-btn" type="button" class="w-full bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 font-bold rounded-xl py-3 text-sm shadow-lg shadow-emerald-500/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-plus-circle"></i> ルームを新規作成
                            </button>
                        </div>
                    </div>

                    <div id="lobby-alert" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2">
                        <i class="fa-solid fa-circle-exclamation text-sm shrink-0"></i>
                        <span id="lobby-alert-msg"></span>
                    </div>
                </div>
            </div>

            <div id="chat-screen" class="w-full h-full flex hidden">
                <aside id="chat-sidebar" class="w-64 bg-slate-900/90 border-r border-slate-800 flex flex-col shrink-0 absolute md:relative z-20 h-full transition-transform duration-300 -translate-x-full md:translate-x-0">
                    <div class="p-4 border-b border-slate-800 space-y-3">
                        <div>
                            <span class="text-[10px] font-semibold tracking-wider text-slate-400 uppercase">ルーム名</span>
                            <h3 id="sidebar-room-name" class="font-bold text-sm text-slate-100 truncate">----</h3>
                        </div>
                    </div>

                    <div class="flex-1 p-4 overflow-y-auto scrollbar-thin space-y-3">
                        <div class="flex justify-between items-center text-xs text-slate-400 font-semibold">
                            <span>参加メンバー</span>
                            <span id="member-count-badge" class="bg-slate-800 text-emerald-400 px-2 py-0.5 rounded-full text-[10px]">0</span>
                        </div>
                        <ul id="members-list" class="space-y-1.5"></ul>
                    </div>
                </aside>

                <div id="sidebar-overlay" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-10 hidden md:hidden"></div>

                <div class="flex-1 flex flex-col h-full bg-slate-950/40 relative min-w-0">
                    <div class="md:hidden bg-slate-900/80 border-b border-slate-800 px-4 py-2 flex items-center justify-between">
                        <button id="toggle-sidebar-btn" class="text-slate-400 hover:text-slate-100 p-1">
                            <i class="fa-solid fa-users text-sm"></i>
                            <span class="text-xs ml-1 font-medium">参加者リスト</span>
                        </button>
                    </div>

                    <div id="messages-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 scrollbar-thin"></div>

                    <div class="p-3 sm:p-4 bg-slate-900 border-t border-slate-800">
                        <form id="chat-form" class="flex items-center gap-2">
                            <input type="text" id="message-input" placeholder="メッセージを入力..." autocomplete="off"
                                class="flex-1 bg-slate-950 border border-slate-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 outline-none transition-all">
                            <button type="submit" id="send-btn" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold p-3 rounded-xl shadow-lg shadow-emerald-500/20 active:scale-95 transition-all shrink-0 w-11 h-11 flex items-center justify-center">
                                <i class="fa-solid fa-paper-plane"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let peer = null, conn = null;
        let currentUser = '', currentRoomName = '', members = [], messages = [];
        let isHost = false;
        let connections = []; // ホストの場合の参加者コネクション一覧

        const lobbyScreen = document.getElementById('lobby-screen');
        const chatScreen = document.getElementById('chat-screen');
        const roomInfoBar = document.getElementById('room-info-bar');
        const displayRoomId = document.getElementById('display-room-id');
        const usernameInput = document.getElementById('username-input');
        const tabJoinBtn = document.getElementById('tab-join-btn');
        const tabCreateBtn = document.getElementById('tab-create-btn');
        const formJoin = document.getElementById('form-join');
        const formCreate = document.getElementById('form-create');
        const joinRoomId = document.getElementById('join-room-id');
        const createRoomName = document.getElementById('create-room-name');
        const actionJoinBtn = document.getElementById('action-join-btn');
        const actionCreateBtn = document.getElementById('action-create-btn');
        const leaveRoomBtn = document.getElementById('leave-room-btn');
        const copyRoomIdBtn = document.getElementById('copy-room-id-btn');
        const lobbyAlert = document.getElementById('lobby-alert');
        const lobbyAlertMsg = document.getElementById('lobby-alert-msg');
        const sidebarRoomName = document.getElementById('sidebar-room-name');
        const membersList = document.getElementById('members-list');
        const memberCountBadge = document.getElementById('member-count-badge');
        const messagesContainer = document.getElementById('messages-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');
        const chatSidebar = document.getElementById('chat-sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        function generateRoomId() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let id = ''; for (let i = 0; i < 6; i++) id += chars.charAt(Math.floor(Math.random() * chars.length));
            return id;
        }
        function showAlert(msg) { lobbyAlertMsg.textContent = msg; lobbyAlert.classList.remove('hidden'); }
        function hideAlert() { lobbyAlert.classList.add('hidden'); }

        tabJoinBtn.onclick = () => {
            tabJoinBtn.className = 'flex-1 py-2 text-xs font-semibold rounded-lg text-slate-100 bg-slate-800 shadow';
            tabCreateBtn.className = 'flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400';
            formJoin.classList.remove('hidden'); formCreate.classList.add('hidden'); hideAlert();
        };
        tabCreateBtn.onclick = () => {
            tabCreateBtn.className = 'flex-1 py-2 text-xs font-semibold rounded-lg text-slate-100 bg-slate-800 shadow';
            tabJoinBtn.className = 'flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400';
            formCreate.classList.remove('hidden'); formJoin.classList.add('hidden'); hideAlert();
        };

        // ルーム新規作成
        actionCreateBtn.onclick = () => {
            hideAlert();
            const u = usernameInput.value.trim();
            const name = createRoomName.value.trim();
            if (!u) { showAlert('表示名を入力してください'); return; }
            if (!name) { showAlert('ルーム名を入力してください'); return; }

            const roomId = generateRoomId();
            currentUser = u;
            currentRoomName = name;
            isHost = true;
            members = [u];
            messages = [{ type: 'system', text: `ルーム「${name}」が作成されました`, timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }];

            peer = new Peer(roomId);
            peer.on('open', (id) => {
                enterChatRoom(roomId);
            });
            peer.on('error', (err) => {
                showAlert('ルーム作成エラー: ' + err.type);
            });
            peer.on('connection', (c) => {
                connections.push(c);
                c.on('data', (data) => handleHostData(c, data));
                c.on('close', () => {
                    connections = connections.filter(item => item !== c);
                });
            });
        };

        // ルームに参加
        actionJoinBtn.onclick = () => {
            hideAlert();
            const u = usernameInput.value.trim();
            const roomId = joinRoomId.value.trim().toUpperCase();
            if (!u) { showAlert('表示名を入力してください'); return; }
            if (!roomId) { showAlert('ルームIDを入力してください'); return; }

            currentUser = u;
            isHost = false;

            peer = new Peer();
            peer.on('open', (id) => {
                conn = peer.connect(roomId);
                conn.on('open', () => {
                    conn.send({ type: 'JOIN', username: u });
                });
                conn.on('data', (data) => handleClientData(data));
                conn.on('error', (err) => {
                    showAlert('接続エラー: ルームが見つかりません');
                });
            });
            peer.on('error', (err) => {
                showAlert('接続エラー: ' + err.type);
            });
        };

        function enterChatRoom(id) {
            lobbyScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
            roomInfoBar.classList.remove('hidden');
            roomInfoBar.classList.add('flex');
            displayRoomId.textContent = id;
            renderChatScreen();
        }

        // ホスト側のデータ受信処理
        function handleHostData(c, data) {
            if (data.type === 'JOIN') {
                if (!members.includes(data.username)) {
                    members.push(data.username);
                    messages.push({ type: 'system', text: `${data.username} が参加しました`, timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
                    broadcast({ type: 'UPDATE', members, messages, roomName: currentRoomName });
                    renderChatScreen();
                }
            } else if (data.type === 'MESSAGE') {
                messages.push(data.message);
                broadcast({ type: 'UPDATE', members, messages, roomName: currentRoomName });
                renderChatScreen();
            }
        }

        // クライアント側のデータ受信処理
        function handleClientData(data) {
            if (data.type === 'UPDATE') {
                members = data.members;
                messages = data.messages;
                currentRoomName = data.roomName;
                if (lobbyScreen.classList.contains('hidden') === false) {
                    enterChatRoom(joinRoomId.value.trim().toUpperCase());
                } else {
                    renderChatScreen();
                }
            }
        }

        // ホストから全員へブロードキャスト
        function broadcast(data) {
            connections.forEach(c => c.send(data));
        }

        // メッセージ送信
        chatForm.onsubmit = (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            const msgObj = {
                type: 'user',
                sender: currentUser,
                text: text,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            messageInput.value = '';

            if (isHost) {
                messages.push(msgObj);
                broadcast({ type: 'UPDATE', members, messages, roomName: currentRoomName });
                renderChatScreen();
            } else {
                conn.send({ type: 'MESSAGE', message: msgObj });
            }
        };

        leaveRoomBtn.onclick = () => {
            if (confirm('ルームを退出しますか？')) {
                if (peer) peer.destroy();
                location.reload();
            }
        };

        function renderChatScreen() {
            sidebarRoomName.textContent = currentRoomName || 'チャットルーム';
            memberCountBadge.textContent = members.length;
            membersList.innerHTML = members.map(m => `
                <li class="flex items-center space-x-2 text-xs py-1.5 px-2 rounded-lg bg-slate-800/40 border border-slate-800">
                    <div class="w-2 h-2 rounded-full ${m === currentUser ? 'bg-emerald-400' : 'bg-slate-500'}"></div>
                    <span class="truncate ${m === currentUser ? 'text-emerald-300 font-semibold' : 'text-slate-300'}">${escapeHtml(m)}${m === currentUser ? ' (あなた)' : ''}</span>
                </li>
            `).join('');

            messagesContainer.innerHTML = messages.map(msg => {
                if (msg.type === 'system') {
                    return `<div class="flex justify-center my-2"><span class="bg-slate-800/80 border border-slate-700/50 text-slate-400 text-[11px] px-3 py-1 rounded-full">${escapeHtml(msg.text)}</span></div>`;
                }
                const isSelf = msg.sender === currentUser;
                return `
                    <div class="flex flex-col ${isSelf ? 'items-end' : 'items-start'} my-2">
                        <span class="text-[10px] text-slate-400 mb-1 px-1">${isSelf ? 'あなた' : escapeHtml(msg.sender)} • ${msg.timestamp}</span>
                        <div class="max-w-[80%] rounded-2xl px-4 py-2.5 text-sm ${isSelf ? 'bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-medium rounded-br-none shadow' : 'bg-slate-800 border border-slate-700/60 text-slate-100 rounded-bl-none shadow'}">
                            ${escapeHtml(msg.text)}
                        </div>
                    </div>
                `;
            }).join('');
            scrollToBottom();
        }

        function scrollToBottom() { setTimeout(() => messagesContainer.scrollTop = messagesContainer.scrollHeight, 50); }
        function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

        copyRoomIdBtn.onclick = () => { 
            const roomIdText = displayRoomId.textContent;
            if (roomIdText) navigator.clipboard.writeText(roomIdText); 
        };
        toggleSidebarBtn.onclick = () => { chatSidebar.classList.remove('-translate-x-full'); sidebarOverlay.classList.remove('hidden'); };
        sidebarOverlay.onclick = () => { chatSidebar.classList.add('-translate-x-full'); sidebarOverlay.classList.add('hidden'); };
    </script>
</body>
</html>
